<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Maghuyop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            margin: 0;
            padding: 0px;
        }
        .container img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
        }
        #header {
            margin: 0;
            font-size: 50px;
            color: #333;
        }
        .services {
            margin: 0;
            color: #333;
            padding: 0px;
        }
        .services p {
            margin: 0;
            display: inline-block;
            padding-left: 12px;
            padding-right: 12px;
            font-size: 18px;
         }
        .social-links {
            margin-top: 0px;
        }
        .social-links a {
            display: inline-block;
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-size: 30px;
        }
        .social-links a:hover {
            color: #0073e6;
        }
        .footer {
            margin-top: 20px;
        }
        .footer p {
            color: #333;
            font-size: 12px;
         }
        .footer a {
            color: #333;
            font-size: 12px;
         }
        .footer a {
            text-decoration: none;
        }
        #Footer span {
            padding-left: 6px;
            padding-right: 6px;
        }
        a:not([href]) {
            cursor: pointer;
        }
        @media (min-width: 300px) {
            .container {
                padding: 20px;
            }
        }
        @media (max-width: 350px) {
            #Footer span {
                display: block;
                margin-bottom: 5px;
            }
        }
        #copyright {
            margin-top: 15px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="selfie.webp" alt="Profile Picture"></img>
        <p id="header"></p>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/janmaghuyop/" target="_blank">Linkedin</a>
            <a href="https://www.upwork.com/freelancers/~01d40ed7aed9d24636" target="_blank">Upwork</a>
            <a href="https://github.com/janmaghuyop" target="_blank">Github</a>
            <a href="https://www.facebook.com/jeemaghuyop/" target="_blank">Facebook</a>
            <a href="https://janmaghuyop.github.io/resume.md" target="_blank">Resume</a>
            <a onclick="clickDonate()">Donate</a>
        </div>
        <div class="services">
            <p>DevOps</p>
            <p>Web Development</p>
            <p>Support</p>
            <p>Training</p>
            <p>IT Consulting</p>
        </div>
        <div class="footer">
            <p id="Footer"><p>
            <p id="copyright">Copyright © <span id="year"></span> Jan Maghuyop<p>
        </div>
    </div>
</body>
<script>
    let headerTxt = 'Jan Maghuyop';
    let header = document.getElementById('header')

    let footerHTML = '<span id="time"></span><span><a href="mailto:jan.maghuyop.ph@gmail.com">jan.maghuyop.ph@gmail.com</a></span>'
    let footer = document.getElementById('Footer')

    function setHeaderFooter() {
        header.innerText = headerTxt;
        footer.innerHTML = footerHTML;
    }
    setHeaderFooter();

    function updateTime() {
        const options = {
            timeZone: 'Asia/Manila',
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
        };
        const currentTime = new Date().toLocaleString('en-US', options);
        document.getElementById('time').textContent = currentTime + " (UTC+8) PHT";
    }
    window.onload = updateTime;
    setInterval(updateTime, 60000);

    const btcAddr = "bc1qgzlu9t5ku578ksfq3vldp7rlml3vaqcyd5at3x";

    function clickDonate() {
        header.innerText = "Thank you!";
        footer.innerHTML = '<span>BTC</span><span>' + btcAddr + '</span><span><a onclick="copyBTC()" title="Copy to clipboard!">COPY</a></span>';
    }

    function copyBTC() {
        navigator.clipboard.writeText(btcAddr);
        alert("Bitcoin address copied to clipboard: " + btcAddr);
        setHeaderFooter();
        updateTime();
    }
    const currentYear = new Date().getFullYear();
    document.getElementById('year').textContent = currentYear;
</script>
</html>
