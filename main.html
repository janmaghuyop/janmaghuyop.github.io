<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Maghuyop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .profile-container {
            text-align: center;
        }
        .profile-container img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
        }
        .header {
              margin-top: 30px;
              font-size: 30px;
              color: #333;
        }
        .social-links {
            margin-top: 20px;
        }
        .social-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-size: 20px;
        }
        .social-links a:hover {
            color: #0073e6;
        }
        .footer {
            margin-top: 30px;
        }
        .footer p {
            color: #333;
            font-size: 12px;
         }
        .footer a {
            color: #333;
            font-size: 12px;
         }
        .footer a {
            text-decoration: none;
        }
        #time {
            margin-right: 15px;
        }
        a:not([href]) {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="selfie.webp" alt="Profile Picture"></img>
        <div class="header">
            <p id="header"></p>
        </div>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/janmaghuyop/" target="_blank">Linkedin</a>
            <a href="https://www.upwork.com/freelancers/~01d40ed7aed9d24636" target="_blank">Upwork</a>
            <a href="https://github.com/janmaghuyop" target="_blank">Github</a>
            <a href="https://www.facebook.com/jeemaghuyop/" target="_blank">Facebook</a>
            <a onclick="clickDonate()">Donate</a>
        </div>
        <div class="footer">
            <p id="Footer"><p>
        </div>
    </div>
</body>
<script>
    let headerTxt = 'Jan Maghuyop . DevOps . Developer . Support . Consultant';
    let header = document.getElementById('header')

    let footerHTML = '<span id="time"></span><a href="mailto:jan.maghuyop.ph@gmail.com">jan.maghuyop.ph@gmail.com</a>'
    let footer = document.getElementById('Footer')

    function setHeaderFooter() {
        header.innerText = headerTxt;
        footer.innerHTML = footerHTML;
    }
    setHeaderFooter();

    function updateTime() {
        const options = {
            timeZone: 'Asia/Manila',
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
        };
        const currentTime = new Date().toLocaleString('en-US', options);
        document.getElementById('time').textContent = currentTime + " (UTC+8) PHT";
    }
    window.onload = updateTime;
    setInterval(updateTime, 60000);

    const btcAddr = "bc1qgzlu9t5ku578ksfq3vldp7rlml3vaqcyd5at3x";

    function clickDonate() {
        header.innerHTML = "Thank you!";
        footer.innerHTML = '<span style="margin-right: 20px;">BTC</span> ' + btcAddr + ' <a onclick="copyBTC()" title="Copy to clipboard!" style="margin-left: 20px;">COPY</a>';
    }

    function copyBTC() {
        navigator.clipboard.writeText(btcAddr);
        alert("Bitcoin address copied to clipboard: " + btcAddr);
        setHeaderFooter();
        updateTime();
    }
</script>
</html>
